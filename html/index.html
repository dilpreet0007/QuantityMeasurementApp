<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantity Measurement</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="root">
    <header>
      <h1>Welcome To Quantity Measurement</h1>
    </header>
    <main>
      <section>
        <h2>CHOOSE TYPE</h2>
        <div class="grid" id="categoryGrid">
          <div class="card active">
            <div class="icon"></div>
            <span>Length</span>
          </div>
          <div class="card">
            <div class="icon"></div>
            <span>Weight</span>
          </div>
          <div class="card">
            <div class="icon"></div>
            <span>Temperature</span>
          </div>
          <div class="card">
            <div class="icon"></div>
            <span>Volume</span>
          </div>
        </div>
      </section>

      <section>
        <h2>CHOOSE ACTION</h2>
        <div class="tabs">
          <button class="btn active">Comparison</button>
          <button class="btn">Conversion</button>
          <button class="btn">Arithmetic</button>
        </div>
      </section>

      <section>
        <div class="flex">
          <div class="group">
            <label>FROM</label>
            <input step="any" type="number" value="1">
            <div class="dropdown">
              <div class="dropdown-head"><span>Kilometer</span><span class="arrow">▲</span></div>
              <div class="dropdown-list">
                <div class="option active">Kilometer</div>
                <div class="option">Meters</div>
                <div class="option">Centimeters</div>
                <div class="option">Millimeters</div>
                <div class="option">Mile</div>
                <div class="option">Yard</div>
                <div class="option">Feet</div>
                <div class="option">Inch</div>
              </div>
            </div>
          </div>
          <div class="group">
            <label>TO</label>
            <input readonly type="text" value="1000">
            <div class="dropdown">
              <div class="dropdown-head"><span>Meters</span><span class="arrow">▲</span></div>
              <div class="dropdown-list">
                <div class="option">Kilometer</div>
                <div class="option active">Meters</div>
                <div class="option">Centimeters</div>
                <div class="option">Millimeters</div>
                <div class="option">Mile</div>
                <div class="option">Yard</div>
                <div class="option">Feet</div>
                <div class="option">Inch</div>
              </div>
            </div>
          </div>
        </div>
        <button class="btn-reset">Reset</button>
      </section>
    </main>
  </div>
</body>
</html>

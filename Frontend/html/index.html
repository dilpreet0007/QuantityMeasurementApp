<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantity Measurement</title>
  <link rel="stylesheet" href="/Frontend/css/style.css">
</head>
<body>
  <div id="root">
    <header>
      <h1>Welcome To Quantity Measurement</h1>
    </header>
    <main>
      <!-- Choose Type -->
      <section>
        <h2>CHOOSE TYPE</h2>
        <div class="grid" id="categoryGrid">
          <div class="card active"><span>Length</span></div>
          <div class="card"><span>Weight</span></div>
          <div class="card"><span>Temperature</span></div>
          <div class="card"><span>Volume</span></div>
        </div>
      </section>

      <!-- Choose Action -->
      <section>
        <h2>CHOOSE ACTION</h2>
        <div class="tabs">
          <button class="btn active">Conversion</button>
          <button class="btn">Comparison</button>
          <button class="btn">Arithmetic</button>
        </div>
      </section>

      <!-- Input / Output -->
      <section>
        <div class="flex">
          <div class="group">
            <label>FROM</label>
            <input step="any" type="number" value="1">
            <div class="dropdown">
              <div class="dropdown-head"><span>Kilometer</span><span class="arrow">▲</span></div>
              <div class="dropdown-list"></div>
            </div>
          </div>
          <div class="group">
            <label>TO</label>
            <input readonly type="text" value="">
            <div class="dropdown">
              <div class="dropdown-head"><span>Meters</span><span class="arrow">▲</span></div>
              <div class="dropdown-list"></div>
            </div>
          </div>
        </div>

        <!-- Operator Row (hidden unless Arithmetic is selected) -->
        <div class="operator-row" style="display:none;">
          <label>Operator</label>
          <select class="operator-dropdown">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
          </select>
        </div>

        <button class="btn-reset">Convert</button>
      </section>
      <div class="res">
          <!-- Comparison Result -->
          <section>
            <h2>Comparison Result</h2>
            <div id="comparison-result">No comparison yet.</div>
          </section>

          <!-- History Section -->
          <section>
            <h2>History</h2>
            <div id="history">No history yet.</div>
          </section>
      </div>
      
    </main>
  </div>

  <script type="module" src="/Backend/app.js"></script>
</body>
</html>
